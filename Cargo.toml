[workspace]
resolver = "3"
members = [
    "crates/khodz-core",
    "crates/khodz-db",
    "crates/khodz-device",
    "crates/khodz-io",
    "crates/khodz-part",
    "crates/khodz-fs",
    "crates/khodz-carve",
    "crates/khodz-engine",
    "app/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
repository = "https://github.com/khodz/khodz-recovery"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
arithmetic_side_effects = "warn"

# Dependencies (hashing, SQLite, compression) are ~100x slower unoptimized, which makes dev builds
# unrepresentative for multi-GB disks. Optimize them always; our own crates keep fast debug builds.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
