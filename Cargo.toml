[workspace]
resolver = "3"
members = ["crates/khodz-core", "crates/khodz-db", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
repository = "https://github.com/khodz/khodz-recovery"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
arithmetic_side_effects = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
