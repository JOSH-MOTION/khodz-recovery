[package]
name = "khodz-recovery"
description = "Khodz Recovery desktop application"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[lib]
name = "khodz_recovery_lib"
crate-type = ["rlib"]

[dependencies]
khodz-core = { path = "../../crates/khodz-core" }
khodz-db = { path = "../../crates/khodz-db" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.11.6", features = [] }

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }
