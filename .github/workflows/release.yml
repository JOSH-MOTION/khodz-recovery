# Builds installers and attaches them to a *draft* GitHub release, which a maintainer reviews
# and publishes by hand. Triggered by pushing a tag like v0.1.0, or manually.
#
# Windows: MSI (WiX) and setup.exe (NSIS). macOS: universal .dmg (Apple Silicon + Intel).
# Code signing is optional and only enabled when the secrets below exist; without them the
# installers are UNSIGNED and the release notes say so (see RELEASING.md).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regression:
    name: Regression suite
    uses: ./.github/workflows/ci.yml

  build:
    name: Installers (${{ matrix.name }})
    needs: regression
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            args: "--bundles msi,nsis"
          - name: macOS universal
            os: macos-latest
            args: "--target universal-apple-darwin --bundles app,dmg"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Rust targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      # Signing secrets are exported only when present, so an unsigned build never sees empty
      # values (which the bundler would try, and fail, to use).
      - name: Enable macOS signing and notarisation (if configured)
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ]; then
            for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
              if [ -n "${!v}" ]; then
                { echo "$v<<__EOF__"; echo "${!v}"; echo "__EOF__"; } >> "$GITHUB_ENV"
              fi
            done
            echo "SIGNED=signed" >> "$GITHUB_ENV"
          else
            echo "SIGNED=unsigned" >> "$GITHUB_ENV"
          fi
      - name: Windows signing status
        if: runner.os == 'Windows'
        shell: bash
        # Windows Authenticode signing is not configured yet (needs a certificate; see RELEASING.md).
        run: echo "SIGNED=unsigned" >> "$GITHUB_ENV"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: "Khodz Recovery ${{ github.ref_name }}"
          releaseBody: |
            Draft built by CI from ${{ github.sha }}. The full regression suite passed before these installers were built.

            ${{ matrix.name }} installers in this build are **${{ env.SIGNED }}**. Unsigned installers trigger Windows SmartScreen / macOS Gatekeeper warnings; see RELEASING.md.

            Khodz Recovery only ever reads source drives. Reading a drive directly needs administrator rights (Windows) or root / Full Disk Access (macOS); disk images need none.
          releaseDraft: true
          prerelease: true
      # Manual runs (no tag) keep the installers as workflow artifacts instead of a release.
      - name: Upload installers
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ runner.os }}
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
            target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
